# Nginx 配置文件 (适用于 lanfanyunjic.homes)
server {
    listen 80;
    listen [::]:80;
    server_name lanfanyunjic.homes www.lanfanyunjic.homes;
    
    # 强制将 HTTP 重定向至 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lanfanyunjic.homes www.lanfanyunjic.homes;

    # 网站根目录路径
    root /var/www/lanfanyunjic.homes;
    index index.html;

    # SSL 证书配置 (请替换为您实际证书路径，例如 Certbot Let's Encrypt 证书)
    # ssl_certificate /etc/letsencrypt/live/lanfanyunjic.homes/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lanfanyunjic.homes/privkey.pem;

    # SSL 安全参数推荐
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip 压缩支持，极速首屏加载
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 默认静态文件路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态静态资源浏览器强缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # IndexNow 验证文本与 robots.txt 直接放行
    location ~* ^/(robots\.txt|sitemap\.xml|[a-f0-9]{32}\.txt)$ {
        allow all;
        expires 1d;
    }

    # 404 自定义页面
    error_page 404 /index.html;
}

