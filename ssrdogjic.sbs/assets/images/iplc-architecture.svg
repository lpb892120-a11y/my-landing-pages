<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="iplcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#11182c"/>
    </linearGradient>
    <linearGradient id="tunnelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f59b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#iplcBg)"/>

  <text x="400" y="55" fill="#00e5ff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">IPLC 内网专线 vs 普通直连架构对比</text>
  <text x="400" y="85" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">不经过公网 GFW 审查拦截 · 物理光纤端到端内网直达</text>

  <!-- Top Path: IPLC Special Line -->
  <g transform="translate(60, 120)">
    <rect width="680" height="135" rx="14" fill="#0f172a" stroke="#00e5ff" stroke-width="1.8"/>
    <text x="24" y="32" fill="#00e5ff" font-family="sans-serif" font-size="15" font-weight="bold">【SSRDog 专线】IPLC/IEPL 国际内网专线隧道</text>
    
    <!-- Step 1: Domestic Entry -->
    <rect x="30" y="50" width="130" height="60" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="95" y="76" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">国内 BGP 入口</text>
    <text x="95" y="96" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">全网三网千兆中继</text>

    <!-- Tunnel Pipe -->
    <rect x="175" y="68" width="310" height="24" rx="12" fill="url(#tunnelGrad)" opacity="0.85"/>
    <text x="330" y="84" fill="#0a0e1c" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">⚡ 物理专线光纤直穿 (0丢包 · 28ms 超低时延)</text>

    <!-- Step 2: Overseas Exit -->
    <rect x="500" y="50" width="150" height="60" rx="8" fill="#1e293b" stroke="#00f59b"/>
    <text x="575" y="76" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">海外机房纯净出口</text>
    <text x="575" y="96" fill="#00f59b" font-family="sans-serif" font-size="10" text-anchor="middle">原生住宅IP · 秒开4K</text>
  </g>

  <!-- Bottom Path: Ordinary Public Line -->
  <g transform="translate(60, 280)">
    <rect width="680" height="145" rx="14" fill="#141420" stroke="#475569" stroke-width="1"/>
    <text x="24" y="32" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="bold">【普通直连廉价机场】公网中转与普通宽带</text>
    
    <rect x="30" y="55" width="130" height="60" rx="8" fill="#1f1e2e" stroke="#64748b"/>
    <text x="95" y="81" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">普通家庭宽带</text>
    <text x="95" y="101" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">单线出口</text>

    <!-- Block / High Latency Pipe -->
    <path d="M 175 85 L 485 85" stroke="#ef4444" stroke-width="4" stroke-dasharray="8,6"/>
    <circle cx="330" cy="85" r="18" fill="#ef4444"/>
    <text x="330" y="90" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✕</text>
    <text x="330" y="125" fill="#f87171" font-family="sans-serif" font-size="11" text-anchor="middle">公网出口拥堵 · GFW QoS 严重限速 · 丢包率高达 35%</text>

    <rect x="500" y="55" width="150" height="60" rx="8" fill="#1f1e2e" stroke="#64748b"/>
    <text x="575" y="81" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">廉价广播机房</text>
    <text x="575" y="101" fill="#f87171" font-family="sans-serif" font-size="10" text-anchor="middle">黑名单IP · 频繁断连</text>
  </g>
</svg>

