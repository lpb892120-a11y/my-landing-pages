<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#191024"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#gameBg)"/>

  <text x="400" y="55" fill="#00e5ff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">电竞级国际服游戏低延迟专线加速</text>
  <text x="400" y="85" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">UDP 全功能支持 · FullCone NAT 穿透 · 拒绝高 Ping 与丢包跳 ping</text>

  <!-- Game Cards -->
  <g transform="translate(60, 130)">
    <rect width="200" height="230" rx="14" fill="#141a2e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="45" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Apex Legends</text>
    <text x="100" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">东京/新加坡服务器</text>
    <circle cx="100" cy="130" r="35" fill="rgba(0, 245, 155, 0.1)" stroke="#00f59b" stroke-width="3"/>
    <text x="100" y="132" fill="#00f59b" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">28ms</text>
    <text x="100" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">0% 丢包率</text>
    <text x="100" y="195" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">NAT Type: Full Cone</text>
  </g>

  <g transform="translate(300, 130)">
    <rect width="200" height="230" rx="14" fill="#141a2e" stroke="#ff007a" stroke-width="1.5"/>
    <text x="100" y="45" fill="#ff4d94" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Valorant 瓦罗兰特</text>
    <text x="100" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">亚太服 / 港服专线</text>
    <circle cx="100" cy="130" r="35" fill="rgba(255, 0, 122, 0.1)" stroke="#ff007a" stroke-width="3"/>
    <text x="100" y="132" fill="#ff007a" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">19ms</text>
    <text x="100" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">0% 丢包率</text>
    <text x="100" y="195" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">极速击杀无判定延迟</text>
  </g>

  <g transform="translate(540, 130)">
    <rect width="200" height="230" rx="14" fill="#141a2e" stroke="#7928ca" stroke-width="1.5"/>
    <text x="100" y="45" fill="#c084fc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Steam / CS2</text>
    <text x="100" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">全球社区服与商店</text>
    <circle cx="100" cy="130" r="35" fill="rgba(121, 40, 202, 0.1)" stroke="#a855f7" stroke-width="3"/>
    <text x="100" y="132" fill="#a855f7" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">32ms</text>
    <text x="100" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">满速下载跑满带宽</text>
    <text x="100" y="195" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">直连亚服匹配秒进</text>
  </g>

  <!-- Bottom Quote -->
  <text x="400" y="415" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">🔥 全球多线直连核心机房，支持 UDP 转发与游戏加速模式，告别高丢包与排队卡顿</text>
</svg>

