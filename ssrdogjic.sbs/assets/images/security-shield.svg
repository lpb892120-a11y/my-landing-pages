<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#0e1f38"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#shieldGrad)"/>

  <text x="400" y="60" fill="#00e5ff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">多层军工级数据加密与隐私安全防护</text>
  <text x="400" y="90" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">无日志保留策略 (No-Log) · 防 WebRTC 泄漏 · 防 DNS 劫持污染</text>

  <!-- Big Shield in center -->
  <g transform="translate(350, 140)">
    <path d="M 50 0 L 100 25 L 100 90 C 100 135, 50 165, 50 165 C 50 165, 0 135, 0 90 L 0 25 Z" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="3"/>
    <path d="M 50 15 L 88 35 L 88 85 C 88 120, 50 148, 50 148 C 50 148, 12 120, 12 85 L 12 35 Z" fill="#1e293b" stroke="#7928ca" stroke-width="2"/>
    <text x="50" y="92" fill="#00f59b" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle">✓</text>
  </g>

  <!-- Left Features -->
  <g transform="translate(80, 150)">
    <rect width="220" height="70" rx="10" fill="#131d33" stroke="#00e5ff" stroke-width="1.2"/>
    <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">ChaCha20-Poly1305</text>
    <text x="20" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">最高标准 AEAD 流量全密文</text>
  </g>
  <g transform="translate(80, 245)">
    <rect width="220" height="70" rx="10" fill="#131d33" stroke="#00e5ff" stroke-width="1.2"/>
    <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">DoH / DoT 纯净 DNS</text>
    <text x="20" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">彻底杜绝 ISP 本地运营商投毒</text>
  </g>

  <!-- Right Features -->
  <g transform="translate(500, 150)">
    <rect width="220" height="70" rx="10" fill="#131d33" stroke="#00e5ff" stroke-width="1.2"/>
    <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">零日志 (Zero-Log)</text>
    <text x="20" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">内存运行不落地，无访问记录</text>
  </g>
  <g transform="translate(500, 245)">
    <rect width="220" height="70" rx="10" fill="#131d33" stroke="#00e5ff" stroke-width="1.2"/>
    <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">防真实 IP 探针泄漏</text>
    <text x="20" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">有效隔离出海账号关联与风控</text>
  </g>

  <!-- Bottom Guarantee Banner -->
  <rect x="180" y="370" width="440" height="42" rx="21" fill="#0d1b2e" stroke="#00f59b" stroke-width="1.5"/>
  <text x="400" y="396" fill="#00f59b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🛡️ 银行级加密隧道，让出海翻墙与跨境商务固若金汤</text>
</svg>

