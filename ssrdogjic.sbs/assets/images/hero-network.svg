<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid Matrix -->
  <g opacity="0.15" stroke="#00e5ff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Central Globe & Orbits -->
  <ellipse cx="400" cy="240" rx="260" ry="110" fill="none" stroke="#7928ca" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <ellipse cx="400" cy="240" rx="330" ry="160" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Core Hub -->
  <circle cx="400" cy="240" r="48" fill="#121b2d" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>
  <text x="400" y="235" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SSRDog</text>
  <text x="400" y="255" fill="#00e5ff" font-family="sans-serif" font-size="11" text-anchor="middle">IPLC Core</text>

  <!-- Global Node 1: Hong Kong -->
  <g transform="translate(220, 160)">
    <circle cx="0" cy="0" r="28" fill="#152136" stroke="#00f59b" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">香港 HK</text>
    <path d="M 0 0 L 180 80" stroke="url(#cyanLine)" stroke-width="2.5"/>
  </g>

  <!-- Global Node 2: Japan Tokyo -->
  <g transform="translate(580, 150)">
    <circle cx="0" cy="0" r="28" fill="#152136" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">日本 JP</text>
    <path d="M 0 0 L -180 90" stroke="url(#cyanLine)" stroke-width="2.5"/>
  </g>

  <!-- Global Node 3: Singapore -->
  <g transform="translate(190, 330)">
    <circle cx="0" cy="0" r="28" fill="#152136" stroke="#7928ca" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">新加坡 SG</text>
    <path d="M 0 0 L 210 -90" stroke="url(#cyanLine)" stroke-width="2.5"/>
  </g>

  <!-- Global Node 4: US Silicon Valley -->
  <g transform="translate(610, 320)">
    <circle cx="0" cy="0" r="28" fill="#152136" stroke="#ff007a" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">美国 US</text>
    <path d="M 0 0 L -210 -80" stroke="url(#cyanLine)" stroke-width="2.5"/>
  </g>

  <!-- High Speed Indicators -->
  <rect x="290" y="390" width="220" height="38" rx="19" fill="#0d1424" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.5"/>
  <circle cx="312" cy="409" r="6" fill="#00f59b"/>
  <text x="395" y="414" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">99.99% SLA 全球专线运行</text>
</svg>

