<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景暗调光晕 -->
  <rect width="700" height="500" rx="24" fill="#0b1120" />
  <circle cx="350" cy="250" r="230" fill="url(#centerGlow)" />

  <!-- 经纬环形轨道 -->
  <ellipse cx="350" cy="250" rx="280" ry="140" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6" />
  <ellipse cx="350" cy="250" rx="200" ry="90" fill="none" stroke="#334155" stroke-width="1.5" />
  <ellipse cx="350" cy="250" rx="100" ry="45" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.6" />

  <!-- 连接光纤拓扑线条 -->
  <path d="M140 180 Q 240 120, 350 250" stroke="url(#lineGrad1)" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M350 250 Q 480 140, 560 170" stroke="url(#lineGrad2)" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M350 250 Q 300 360, 200 370" stroke="url(#lineGrad1)" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M350 250 Q 450 380, 540 330" stroke="url(#lineGrad2)" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M140 180 Q 350 80, 560 170" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.5" />
  <path d="M200 370 Q 370 430, 540 330" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.5" />

  <!-- 中心核心枢纽：青云梯专线大脑 -->
  <g transform="translate(350, 250)">
    <circle cx="0" cy="0" r="42" fill="#0284c7" opacity="0.25" filter="url(#nodeGlow)" />
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5" />
    <circle cx="0" cy="0" r="14" fill="#00f2fe" filter="url(#nodeGlow)" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" fill="#0f172a">IEPL</text>
  </g>

  <!-- 节点1：中国香港专线 -->
  <g transform="translate(140, 180)">
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#38bdf8" />
    <rect x="-45" y="28" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="0" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" font-weight="bold">香港专线 11ms</text>
  </g>

  <!-- 节点2：日本东京节点 -->
  <g transform="translate(560, 170)">
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#34d399" />
    <rect x="-45" y="28" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="0" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" font-weight="bold">东京BGP 36ms</text>
  </g>

  <!-- 节点3：新加坡节点 -->
  <g transform="translate(200, 370)">
    <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <circle cx="0" cy="0" r="7" fill="#818cf8" />
    <rect x="-45" y="26" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="0" y="43" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" font-weight="bold">新加坡原生 45ms</text>
  </g>

  <!-- 节点4：美国洛杉矶AI节点 -->
  <g transform="translate(540, 330)">
    <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#f472b6" stroke-width="2" />
    <circle cx="0" cy="0" r="7" fill="#f472b6" />
    <rect x="-45" y="26" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="0" y="43" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" font-weight="bold">美西原生解锁 118ms</text>
  </g>

  <!-- 实时状态浮窗 -->
  <g transform="translate(30, 420)">
    <rect width="210" height="48" rx="10" fill="#0f172a" opacity="0.9" stroke="#334155" />
    <circle cx="20" cy="24" r="5" fill="#10b981" filter="url(#nodeGlow)" />
    <text x="36" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">全球专线网络状态: 极佳</text>
    <text x="36" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">BGP入口智能调度 · 0丢包</text>
  </g>

  <g transform="translate(460, 420)">
    <rect width="210" height="48" rx="10" fill="#0f172a" opacity="0.9" stroke="#334155" />
    <path d="M18 24 L24 30 L34 18" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">4K/8K 极速秒开</text>
    <text x="44" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">双向 10Gbps 骨干带宽冗余</text>
  </g>
</svg>

