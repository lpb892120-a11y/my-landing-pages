<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- Ambient circles -->
  <circle cx="100" cy="80" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="500" cy="320" r="160" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Graphic Icon -->
  <g transform="translate(0, -20)">
    <path d="M300 130 L420 180 L420 280 C420 350 370 410 300 440 C230 410 180 350 180 280 L180 180 Z" fill="url(#grad)" filter="url(#glow)"/>
    <path d="M265 280 L290 305 L345 250" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Typography Card -->
  <rect x="30" y="305" width="540" height="72" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)"/>
  <text x="50" y="336" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, sans-serif" font-size="19" font-weight="bold">便宜机场与安全机场选购对比</text>
  <text x="50" y="360" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, sans-serif" font-size="13">IPLC专线、节点协议与防封策略</text>
</svg>